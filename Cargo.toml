[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/braga1k/squ4t"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
